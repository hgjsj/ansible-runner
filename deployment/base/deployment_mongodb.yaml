apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansiblerunner-mongodb
  namespace: ansible-runner
  labels:
    app: ansiblerunner-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansiblerunner-mongodb
  template:
    metadata:
      labels:
        app: ansiblerunner-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ansiblerunner-mongodb-secret
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ansiblerunner-mongodb-secret
                  key: mongo-root-password
            - name: MONGO_INITDB_DATABASE
              value: ansiblerunner
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: init-db-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: ansiblerunner-mongodb-pvc
        - name: init-db-scripts
          configMap:
            name: ansiblerunner-mongodb-configmap
