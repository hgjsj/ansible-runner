apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment_server.yaml
  - deployment_worker.yaml
  - service.yaml

configmapGenerator:
  - name: configfile
    files:
      - config.yaml
secretGenerator:
  - name: server-cert
    files:
      - cert/server.crt
      - cert/server.key
