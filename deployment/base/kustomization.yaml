apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ansible-runner
resources:
  # MongoDB Resources
  - deployment_mongodb.yaml
  - service_mongodb.yaml
  - pvc_mongodb.yaml
  - secret_mongodb.yaml
  - configmap_mongodb.yaml
  # Redis Resources
  - deployment_redis.yaml
  - service_redis.yaml # The file you provided
  - pvc_redis.yaml
  - secret_redis.yaml
  # Vault Resources
  - deployment_vault.yaml
  - service_vault.yaml
  - pvc_vault.yaml
  - configmap_vault.yaml
  # Ansible Runner Resources
  - deployment_server.yaml
  - deployment_worker.yaml
  - service.yaml
configmapGenerator:
  - name: configfile
    files:
      - config.yaml
secretGenerator:
  - name: server-cert
    files:
      - cert/server.crt
      - cert/server.key
generatorOptions:
  disableNameSuffixHash: true
