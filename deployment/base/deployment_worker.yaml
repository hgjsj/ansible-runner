apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner-worker
  namespace: ansible-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner-worker
  template:
    metadata:
      labels:
        app: ansible-runner-worker
    spec:
      containers:
        - name: worker
          image: artifactory.platformdxc-mg.com/vpcp4s-docker/ansible-runner:latest
          imagePullPolicy: IfNotPresent
          command: ["./ansible-runner"]
          args: ["worker"]
          volumeMounts:
            - name: config-volume
              mountPath: /opt/ansible-runner/configs
      volumes:
        - name: config-volume
          configMap:
            name: configfile
