apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner-worker
  template:
    metadata:
      labels:
        app: ansible-runner-worker
    spec:
      containers:
        - name: worker
          image: artifactory.platformdxc-mg.com/vpcp4s-docker/ansible-runner:0.0.2 # Replace with the actual image tag
          imagePullPolicy: IfNotPresent
          command: ["./ansible-runner"]
          args: ["worker"]
