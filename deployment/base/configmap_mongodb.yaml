apiVersion: v1
kind: ConfigMap
metadata:
  name: ansiblerunner-mongodb-configmap
  namespace: ansible-runner
data:
  mongodb_init_db.js: |
    use ansiblerunner;
    db.createUser(
      {
        user: "ansiblerunner",
        pwd: "p4sautomation",
        roles: [
          { role: "readWrite", db: "ansiblerunner" }
        ]
      }
    );
