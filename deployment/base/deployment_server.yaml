apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner-server
  template:
    metadata:
      labels:
        app: ansible-runner-server
    spec:
      containers:
        - name: server
          image: ansible-runner:latest # Replace with the actual image tag
          imagePullPolicy: IfNotPresent
          command: ["./ansible-runner"]
          args: ["server", "-p", "8443"]
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: cert-volume
              mountPath: /opt/ansible-runner/cert
            - name: config-volume
              mountPath: /opt/ansible-runner
      volumes:
        - name: cert-volume
          secret:
            secretName: ansible-runner-secrets
            items:
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
        - name: config-volume
          configMap:
            name: configfile
