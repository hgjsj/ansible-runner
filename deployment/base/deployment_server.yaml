apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner-server
  namespace: ansible-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner-server
  template:
    metadata:
      labels:
        app: ansible-runner-server
    spec:
      containers:
        - name: server
          image: artifactory.platformdxc-mg.com/vpcp4s-docker/ansible-runner:0.0.2 # Replace with the actual image tag
          imagePullPolicy: IfNotPresent
          command: ["./ansible-runner"]
          args: ["server"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /opt/ansible-runner/configs
              readOnly: true
            - name: cert-volume
              mountPath: /opt/ansible-runner/cert
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: configfile
        - name: cert-volume
          secret:
            secretName: server-cert
