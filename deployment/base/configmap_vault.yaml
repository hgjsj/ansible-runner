apiVersion: v1
kind: ConfigMap
metadata:
  name: ansiblerunner-vault-config
  namespace: ansible-runner
data:
  vault-config.hcl: |
    storage "file" {
      path = "/vault/file"
    }
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_disable   = false
      tls_cert_file = "/vault/tls/server.crt"
      tls_key_file  = "/vault/tls/server.key"
    }
    ui = true
